/**:
  ros__parameters:
    # Provisional process values. Keep configurable until the final CAD and
    # process specification confirm the waypoint count, speed and standoff.
    trajectory:
      d_standoff: 0.15
      max_cartesian_step: 0.05
      raster_step_y: 0.10
      raster_step_z: 0.20
      requested_waypoints: 0
      target_speed_mps: 0.0
      velocity_scaling_factor: 0.20
    safety:
      require_workspace_clear: true
      stable_clear_time_s: 0.50
      workspace_wait_timeout_s: 30.0
    metrics:
      enabled: true
      output_directory: ""
    # CAD asset registry. `cad_source` is traceability metadata; ROS/MoveIt
    # consumes only STL/DAE meshes declared in *_mesh_file. The camera-cover
    # STL is already in metres, so it intentionally has no scale parameter.
    cad_assets: [motioncam_carcasa]
    motioncam_carcasa:
      frame_id: world
      # Provisional survey pose: replace with the measured cover installation pose.
      position: [-0.65, -1.2, 1.5]
      orientation_rpy: [0.0, 1.57079632679, 0.0]
      collision_enabled: false
      collision_mesh_file: ""
      fallback_type: box
      size: [0.092, 0.665, 0.088]
      visual_enabled: true
      visual_mesh_file: package://irb2600_coating_cell/meshes/cad/motioncam_housing.stl
      cad_source: "design/Carcasa Cam-1.stl"
    motioncam:
      enabled: true
      parent_frame: world
      optical_frame: motioncam_optical_frame
      position: [-0.65, -1.2, 1.5]
      orientation_rpy: [0.0, 1.57079632679, 0.0]
      near_range_m: 0.778
      far_range_m: 3.034
      horizontal_fov_rad: 0.779
      vertical_fov_rad: 0.644
      max_points: 2000
    c3:
      # Enable once its flange/mount transform is measured.
      enabled: false
      parent_frame: world
      optical_frame: c3_t60_optical_frame
      position: [0.0, 0.0, 0.0]
      orientation_rpy: [0.0, 0.0, 0.0]
      min_distance_m: 0.015
      max_distance_m: 0.150
      simulated_thickness_um: 100.0
    back_pole:
      frame_id: world
      orientation_rpy: [0.0, 0.0, 0.0]
      position: [2.0, 0.2, 0.9]
      size: [1.8, 0.05, 0.0]
      type: cylinder
    bottom_wall:
      frame_id: world
      orientation_rpy: [0.0, 0.0, 0.0]
      position: [2.0, 0.0, 0.25]
      size: [0.1, 2.0, 0.5]
      type: box
    d_safe: 0.05
    left_pillar:
      frame_id: world
      orientation_rpy: [0.0, 0.0, 0.0]
      position: [2.0, 0.7, 1.15]
      size: [0.1, 0.6, 0.9]
      type: box
    obstacles: [bottom_wall, top_wall, left_pillar, right_pillar, back_pole]
    right_pillar:
      frame_id: world
      orientation_rpy: [0.0, 0.0, 0.0]
      position: [2.0, -0.7, 1.15]
      size: [0.1, 0.6, 0.9]
      type: box
    target_structure:
      frame_id: world
      local_normal: [-1.0, 0.0, 0.0]
      mesh_file: package://irb2600_coating_cell/meshes/curved_panel.stl
      orientation_rpy: [0.0, 0.0, 0.0]
      position: [0.6, -1.2, 1.5]
      size: [0.05, 5.0, 2.0]
    top_wall:
      frame_id: world
      orientation_rpy: [0.0, 0.0, 0.0]
      position: [2.0, 0.0, 1.9]
      size: [0.1, 2.0, 0.8]
      type: box
    workspace_clear_margin: 0.15
