# MoveIt 2 Octomap 3D Sensor Updater Configuration
# Subscribes to 3D Point Cloud from RGB-D Camera and updates the planning scene Octomap in real-time.

sensors:
  - point_cloud_sensor

point_cloud_sensor:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /camera/depth/color/points
  max_range: 5.0
  point_subsample: 1
  padding_offset: 0.02
  padding_scale: 1.0
  max_update_rate: 10.0
  filtered_subsample: 1
  filtered_cloud_topic: filtered_cloud
