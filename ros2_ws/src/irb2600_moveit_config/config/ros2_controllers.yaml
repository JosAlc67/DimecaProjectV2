controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    irb2600_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

irb2600_arm_controller:
  ros__parameters:
    joints:
      - track_prismatic_joint
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
